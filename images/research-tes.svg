<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Steerable pulsed transcranial electrical stimulation focusing current on a cortical target">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241a08"/><stop offset="1" stop-color="#33270e"/>
    </linearGradient>
    <radialGradient id="focus" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.85"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="800" height="340" fill="url(#bg)"/>
  <rect width="800" height="340" fill="url(#grid)"/>
  <!-- head silhouette -->
  <path d="M300 268 C 252 240, 226 196, 232 146 C 238 92, 280 52, 338 46 C 402 40, 452 78, 460 132 L 478 158 C 484 167, 478 176, 466 177 L 458 178 C 460 200, 456 226, 444 244 L 446 268 Z" fill="#3a2c12" stroke="#f59e0b" stroke-width="2"/>
  <!-- focal glow -->
  <circle cx="356" cy="128" r="52" fill="url(#focus)"/>
  <circle cx="356" cy="128" r="10" fill="#fde68a"/>
  <!-- scalp electrodes -->
  <g>
    <circle cx="262" cy="96" r="9" fill="#fbbf24"/><circle cx="306" cy="66" r="9" fill="#fbbf24"/><circle cx="356" cy="56" r="9" fill="#fde68a"/><circle cx="404" cy="70" r="9" fill="#fbbf24"/><circle cx="436" cy="106" r="9" fill="#fbbf24"/>
  </g>
  <!-- steering field lines -->
  <g fill="none" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.65">
    <path d="M262 105 C 290 122, 322 128, 346 128"/>
    <path d="M306 75 C 322 96, 336 112, 348 122"/>
    <path d="M356 65 C 356 84, 356 102, 356 116"/>
    <path d="M404 79 C 390 98, 374 114, 364 122"/>
    <path d="M436 115 C 410 126, 386 129, 368 129"/>
  </g>
  <g fill="#fbbf24">
    <path d="M346 122 l14 6 l-14 6 z"/><path d="M364 116 l4 14 l-12 -8 z"/><path d="M368 123 l-2 14 l-10 -10 z"/>
  </g>
  <!-- pulse train -->
  <polyline points="520,250 560,250 566,250 572,196 580,286 588,250 640,250 646,250 652,196 660,286 668,250 724,250" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linejoin="round"/>
  <text x="622" y="180" text-anchor="middle" font-family="Verdana, sans-serif" font-size="14" fill="#fcd34d" letter-spacing="2">PULSED TES</text>
  <!-- steering dial -->
  <g transform="translate(616,96)">
    <circle r="42" fill="#2c2110" stroke="#f59e0b" stroke-width="2"/>
    <line x1="0" y1="0" x2="24" y2="-24" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
    <circle r="6" fill="#fde68a"/>
    <path d="M-30 -18 A 35 35 0 0 1 30 -18" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 5"/>
  </g>
  <text x="616" y="160" text-anchor="middle" font-family="Verdana, sans-serif" font-size="12" fill="#fcd34d" letter-spacing="2">CURRENT STEERING</text>
  <text x="60" y="308" font-family="Verdana, sans-serif" font-size="16" fill="#e8cf9a" letter-spacing="2">NON-INVASIVE &#183; FOCAL &#183; TOLERABLE</text>
</svg>
