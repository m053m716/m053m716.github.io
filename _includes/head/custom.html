<style>
    :root {
      color-scheme: dark;
      --site-bg: #0f1720;
      --site-bg-soft: #162331;
      --site-surface: #182434;
      --site-surface-strong: #203145;
      --site-card-backing: #000000;
      --site-text: #e7eef7;
      --site-text-muted: #aebdca;
      --site-border: #365067;
      --site-link: #6fd6ff;
      --site-link-hover: #f7ca62;
      --site-accent: #6fd6ff;
      --site-accent-2: #f7ca62;
      --site-shadow: 0 16px 45px rgba(0, 0, 0, 0.28);
    }

    html[data-theme="light"] {
      color-scheme: light;
      --site-bg: #f6f8fb;
      --site-bg-soft: #eef4f8;
      --site-surface: #ffffff;
      --site-surface-strong: #edf5fa;
      --site-card-backing: #eef2f5;
      --site-text: #182331;
      --site-text-muted: #536272;
      --site-border: #d4e0e8;
      --site-link: #0969a8;
      --site-link-hover: #995f00;
      --site-accent: #0077b6;
      --site-accent-2: #c77d00;
      --site-shadow: 0 14px 36px rgba(34, 49, 63, 0.12);
    }

    body {
      background:
        linear-gradient(135deg, var(--site-bg) 0%, var(--site-bg-soft) 100%);
      color: var(--site-text);
    }

    html {
      scroll-padding-top: 6rem;
    }

    a,
    .page__content a,
    .author__urls a {
      color: var(--site-link);
    }

    a:hover,
    .page__content a:hover,
    .author__urls a:hover {
      color: var(--site-link-hover);
    }

    .masthead {
      position: sticky;
      top: 0;
      background: color-mix(in srgb, var(--site-bg) 94%, transparent);
      border-bottom: 0;
      box-shadow: none;
      backdrop-filter: blur(12px);
    }

    .masthead__inner-wrap {
      max-width: 1280px;
      padding-bottom: 0;
    }

    .masthead__menu {
      display: flex;
      align-items: flex-end;
      gap: 0.8rem;
    }

    #site-nav {
      flex: 1 1 auto;
    }

    .greedy-nav {
      background: transparent;
    }

    .greedy-nav a,
    .masthead__menu-item {
      color: var(--site-text);
    }

    .greedy-nav a:hover {
      color: var(--site-link-hover);
    }

    .masthead__menu-item--active > a {
      color: var(--site-link-hover);
      background: var(--site-surface);
      border: 1px solid var(--site-border);
      border-bottom-color: var(--site-surface);
      border-radius: 8px 8px 0 0;
      box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.12);
      transform: translateY(1px);
    }

    .greedy-nav > button {
      background-color: var(--site-surface-strong);
      color: var(--site-text);
      border-left: 1px solid var(--site-border);
    }

    .greedy-nav .hidden-links {
      background: var(--site-surface);
      border-color: var(--site-border);
      box-shadow: var(--site-shadow);
    }

    .greedy-nav .hidden-links li {
      border-bottom-color: var(--site-border);
    }

    .greedy-nav .hidden-links .masthead__links-heading {
      padding: 0.55rem 1rem 0.35rem;
      color: var(--site-link-hover);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      border-bottom: 0;
    }

    .greedy-nav .hidden-links .masthead__utility-link a {
      color: var(--site-text);
    }

    .greedy-nav .hidden-links a:hover {
      background: var(--site-surface-strong);
    }

    .greedy-nav .hidden-links:before {
      border-color: var(--site-border) transparent;
    }

    .greedy-nav .hidden-links:after {
      border-color: var(--site-surface) transparent;
    }

    .theme-toggle {
      display: inline-flex;
      align-items: center;
      flex: 0 0 auto;
      gap: 0.45rem;
      min-height: 34px;
      padding: 0.35rem 0.7rem;
      color: var(--site-text);
      background: var(--site-surface);
      border: 1px solid var(--site-border);
      border-radius: 999px;
      box-shadow: none;
      cursor: pointer;
      font: inherit;
      order: -1;
    }

    .theme-toggle:hover {
      color: var(--site-link-hover);
      border-color: var(--site-link-hover);
    }

    .theme-toggle__icon {
      width: 0.8rem;
      height: 0.8rem;
      border-radius: 999px;
      background: var(--site-accent-2);
      box-shadow: inset -4px -3px 0 var(--site-surface-strong);
    }

    html[data-theme="light"] .theme-toggle__icon {
      background: var(--site-accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--site-accent) 24%, transparent);
    }

    #main {
      max-width: 1280px;
    }

    .page .page__inner-wrap {
      padding: 1.25rem;
      background: color-mix(in srgb, var(--site-surface) 94%, transparent);
      border: 1px solid var(--site-border);
      border-radius: 10px;
      box-shadow: var(--site-shadow);
    }

    .archive {
      padding: 1.25rem;
      background: color-mix(in srgb, var(--site-surface) 94%, transparent);
      border: 1px solid var(--site-border);
      border-radius: 10px;
      box-shadow: var(--site-shadow);
    }

    .page .page__inner-wrap--home {
      padding-top: 1.35rem;
    }

    .page__header-tab {
      display: flex;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin: -1.25rem -1.25rem 1.5rem;
      padding: 0.85rem 1rem 0;
      background: color-mix(in srgb, var(--site-bg-soft) 72%, transparent);
      border-bottom: 1px solid var(--site-border);
      border-radius: 10px 10px 0 0;
    }

    .archive > .page__header-tab {
      margin: 0 0 1.5rem;
      padding: 0.85rem 0 0;
      background: transparent;
      border-radius: 0;
    }

    .page__header-tab .page__title {
      display: inline-flex;
      align-items: center;
      min-height: 2.35rem;
      margin: 0;
      padding: 0.48rem 0.9rem;
      color: var(--site-link-hover);
      background: var(--site-surface);
      border: 1px solid var(--site-border);
      border-bottom-color: var(--site-surface);
      border-radius: 8px 8px 0 0;
      font-size: 1.32rem;
      line-height: 1.2;
      transform: translateY(1px);
    }

    .page__header-meta {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex: 1 1 16rem;
      flex-wrap: wrap;
      gap: 0.45rem 0.9rem;
      padding-bottom: 0.58rem;
      color: var(--site-text-muted);
      font-size: 0.78rem;
      line-height: 1.35;
    }

    .page__header-meta:empty {
      display: none;
    }

    .page__header-meta p,
    .page__header-tab .page__date,
    .page__header-tab .page__meta {
      margin: 0;
      color: var(--site-text-muted);
      font-size: 0.78rem;
    }

    .section-heading--with-meta {
      display: inline-flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0.35rem 0.75rem;
      margin: 0 0 0.8rem;
      padding: 0.48rem 0.75rem;
      color: var(--site-text);
      background: var(--site-surface);
      border: 1px solid var(--site-border);
      border-bottom-color: var(--site-surface);
      border-radius: 8px 8px 0 0;
      transform: translateY(1px);
    }

    .section-heading__meta {
      color: var(--site-text-muted);
      font-size: 0.78rem;
      font-weight: 600;
      line-height: 1.35;
    }

    .about-card .section-heading--with-meta {
      display: flex;
      margin: 0 0 0.75rem;
      padding: 0;
      background: transparent;
      border: 0;
      border-radius: 0;
      transform: none;
    }

    .page,
    .page__lead,
    .page__content,
    .page__content p,
    .page__content li,
    .page__content dl,
    .page__content dt,
    .page__content dd,
    .page__content span,
    .page__content strong,
    .page__content em,
    .page__content blockquote,
    .archive,
    .archive__item,
    .archive__item-title,
    .archive__item-excerpt,
    .archive__subtitle,
    .archive__subtitle__collections,
    .page__related,
    .page__related-title,
    .breadcrumbs,
    .breadcrumbs a,
    .toc,
    .toc .nav__title,
    .toc__menu a {
      color: var(--site-text);
    }

    .page__title,
    .page__content h1,
    .page__content h2,
    .page__content h3,
    .page__content h4,
    .author__name {
      color: var(--site-text);
    }

    .page__content h2 {
      border-bottom-color: var(--site-border);
    }

    .page__content .section-heading--with-meta {
      border-bottom-color: var(--site-surface);
    }

    .page__content blockquote {
      border-left-color: var(--site-accent);
      color: var(--site-text-muted);
    }

    .page__date,
    .page__meta,
    .author__bio,
    figcaption {
      color: var(--site-text-muted);
    }

    figcaption a:hover,
    .toc__menu a:hover {
      color: var(--site-link-hover);
    }

    .page__content code,
    p > code,
    a > code,
    li > code,
    figcaption > code,
    td > code,
    pre,
    div.highlighter-rouge,
    figure.highlight {
      color: var(--site-text);
      background: var(--site-surface-strong);
      border-color: var(--site-border);
    }

    div.highlighter-rouge:before,
    figure.highlight:before {
      color: var(--site-text-muted);
      background: var(--site-surface);
      border-left: 1px solid var(--site-border);
      border-bottom: 1px solid var(--site-border);
    }

    .highlight,
    .highlight pre,
    .highlight table,
    .highlight table td {
      color: var(--site-text);
      background: transparent;
    }

    html[data-theme="dark"] .highlight * {
      color: var(--site-text) !important;
    }

    table,
    th,
    td {
      color: var(--site-text);
      border-color: var(--site-border);
    }

    thead,
    th {
      background: var(--site-surface-strong);
    }

    .page__taxonomy-item,
    .pagination li a,
    .pagination--pager {
      color: var(--site-text);
      background: var(--site-surface);
      border-color: var(--site-border);
    }

    .page__taxonomy-item:hover,
    .pagination li a:hover,
    .pagination--pager:hover {
      color: var(--site-link-hover);
      background: var(--site-surface-strong);
    }

    .pagination .disabled,
    .pagination--pager.disabled {
      color: var(--site-text-muted);
      background: transparent;
    }

    .toc {
      background: var(--site-surface);
      border-color: var(--site-border);
      box-shadow: var(--site-shadow);
    }

    .toc .nav__title {
      background: var(--site-surface-strong);
      border-bottom: 1px solid var(--site-border);
    }

    .toc__menu a {
      border-bottom-color: var(--site-border);
    }

    .toc__menu a:hover {
      background: var(--site-surface-strong);
    }

    .notice,
    .notice--primary,
    .notice--info,
    .notice--warning,
    .notice--success,
    .notice--danger {
      color: var(--site-text);
      background: var(--site-surface-strong);
      border: 1px solid var(--site-border);
      box-shadow: none;
    }

    .notice a,
    .notice--primary a,
    .notice--info a,
    .notice--warning a,
    .notice--success a,
    .notice--danger a {
      color: var(--site-link);
    }

    .notice a:hover,
    .notice--primary a:hover,
    .notice--info a:hover,
    .notice--warning a:hover,
    .notice--success a:hover,
    .notice--danger a:hover {
      color: var(--site-link-hover);
    }

    .page__footer,
    .page__footer footer {
      color: var(--site-text-muted);
      background: var(--site-bg);
      border-top-color: var(--site-border);
    }

    .author__bio--tagline {
      margin-top: 0.25rem;
      color: var(--site-link-hover);
      font-weight: 600;
    }

    .sidebar {
      color: var(--site-text);
    }

    .author__urls {
      background: var(--site-surface);
      border-color: var(--site-border);
      box-shadow: var(--site-shadow);
    }

    .author__urls .fa,
    .social-icons .fa {
      color: var(--site-text);
    }

    .author__avatar img {
      border-color: var(--site-border);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.22);
    }

    .btn,
    .btn--inverse,
    button {
      border-radius: 8px;
    }

    hr {
      border-top-color: var(--site-border) !important;
      border-bottom-color: var(--site-border) !important;
    }

    .news-feed {
      display: grid;
      gap: 1.15rem;
      margin: 1rem -1.25rem 2rem;
      padding: 1.15rem 1.25rem 1.45rem;
      background: var(--site-card-backing);
      border-top: 1px solid var(--site-border);
      border-bottom: 1px solid var(--site-border);
    }

    .about-feed {
      margin: 0 -1.25rem 1.5rem;
      padding: 1.15rem 1.25rem 1.45rem;
      background: var(--site-card-backing);
      border-top: 1px solid var(--site-border);
      border-bottom: 1px solid var(--site-border);
    }

    .archive-intro {
      margin: 0 0 1rem;
      color: var(--site-text-muted);
    }

    .archive-feed {
      display: grid;
      gap: 1.15rem;
      margin: 1rem -1.25rem 0;
      padding: 1.15rem 1.25rem 1.45rem;
      background: var(--site-card-backing);
      border-top: 1px solid var(--site-border);
      border-bottom: 1px solid var(--site-border);
    }

    .archive-feed .list__item {
      margin: 0;
      padding: 1rem;
      color: var(--site-text);
      background: var(--site-surface);
      border: 1px solid var(--site-border);
      border-radius: 8px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.16);
      scroll-margin-top: 6rem;
    }

    .archive-feed .archive__item {
      margin: 0;
    }

    .archive-feed .archive__item-title {
      margin: 0 0 0.55rem;
      color: var(--site-text);
      font-size: 1.05rem;
      line-height: 1.28;
    }

    .archive-feed .archive__item-title a {
      text-decoration: none;
    }

    .archive-feed .archive__item-title a:hover {
      text-decoration: underline;
    }

    .archive-feed .archive__item p,
    .archive-feed .archive__item-excerpt,
    .archive-feed .page__date,
    .archive-feed .page__meta {
      color: var(--site-text);
    }

    .archive-feed .page__date,
    .archive-feed .page__meta,
    .archive-feed .archive__item > p:first-of-type {
      margin-top: 0.2rem;
      color: var(--site-text-muted);
      font-size: 0.82rem;
      line-height: 1.45;
    }

    .archive-feed .archive__item-excerpt {
      margin-top: 0.65rem;
      margin-bottom: 0;
    }

    .about-card,
    .news-card {
      position: relative;
      color: var(--site-text);
      background: var(--site-surface);
      border: 1px solid var(--site-border);
      border-radius: 8px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.16);
      scroll-margin-top: 6rem;
      scroll-snap-align: start;
    }

    .about-card {
      margin: 0;
      padding: 1rem 1rem 1.9rem;
    }

    .news-card {
      padding: 1rem 1rem 1.9rem;
    }

    .about-card:focus,
    .news-card:focus {
      outline: 2px solid var(--site-accent);
      outline-offset: 3px;
    }

    .about-card__body {
      position: relative;
      max-height: 13.75rem;
      overflow: hidden;
      -webkit-mask-image: linear-gradient(#000 62%, transparent 100%);
      mask-image: linear-gradient(#000 62%, transparent 100%);
      will-change: max-height;
    }

    .about-card__body > *:last-child {
      margin-bottom: 0;
    }

    .researcherid-badge {
      display: inline-block;
      margin: 0.15rem 0 0.8rem;
      line-height: 0;
    }

    .researcherid-badge img {
      display: block;
      width: 121px;
      height: 73px;
      border-radius: 4px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
    }

    .news-card__header {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0.25rem 0.7rem;
      margin-bottom: 0.65rem;
      padding-bottom: 0.55rem;
      border-bottom: 1px solid color-mix(in srgb, var(--site-border) 76%, transparent);
    }

    .news-card__date {
      color: var(--site-link-hover);
      font-size: 0.82rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .news-card__title {
      margin: 0;
      color: var(--site-text);
      font-size: 1.05rem;
      line-height: 1.28;
    }

    .news-card__body {
      position: relative;
      max-height: 7.2rem;
      overflow: hidden;
      -webkit-mask-image: linear-gradient(#000 64%, transparent 100%);
      mask-image: linear-gradient(#000 64%, transparent 100%);
      will-change: max-height;
    }

    .news-card.has-video-preview .news-card__body {
      /* height is set by JS to fit the video exactly; no fade mask */
      -webkit-mask-image: none;
      mask-image: none;
    }

    .news-card__body > h3:first-child {
      display: none;
    }

    .news-card__body p:first-of-type {
      margin-top: 0;
    }

    .news-card__body > *:last-child {
      margin-bottom: 0;
    }

    .about-card.is-expanded,
    .news-card.is-expanded {
      padding-bottom: 1.2rem;
    }

    .about-card.is-expanded .about-card__body,
    .news-card.is-expanded .news-card__body {
      max-height: none;
      overflow: visible;
      -webkit-mask-image: none;
      mask-image: none;
    }

    .about-card__expand,
    .news-card__expand {
      position: absolute;
      left: 50%;
      bottom: -0.75rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.55rem;
      height: 1.55rem;
      padding: 0;
      color: var(--site-bg);
      background: var(--site-link-hover);
      border: 1px solid var(--site-border);
      border-radius: 999px;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.22);
      font-size: 1rem;
      font-weight: 700;
      line-height: 1;
      transform: translateX(-50%);
      cursor: pointer;
    }

    .about-card__expand:hover,
    .about-card__expand:focus,
    .news-card__expand:hover,
    .news-card__expand:focus {
      color: var(--site-bg);
      background: var(--site-accent);
      outline: none;
    }

    .about-card:not(.is-expandable),
    .news-card:not(.is-expandable) {
      padding-bottom: 1rem;
    }

    .about-card:not(.is-expandable) .about-card__body,
    .news-card:not(.is-expandable) .news-card__body {
      max-height: none;
      -webkit-mask-image: none;
      mask-image: none;
    }

    .about-card:not(.is-expandable) .about-card__expand,
    .news-card:not(.is-expandable) .news-card__expand {
      display: none;
    }

    .news-video-embed video,
    iframe {
      max-width: 100%;
      border-radius: 8px;
      border-color: var(--site-border) !important;
    }

    .news-card.has-video-preview .news-video-embed {
      margin-top: 0.25rem;
    }

    .navbar {
      background: color-mix(in srgb, var(--site-surface) 84%, transparent) !important;
      border-left: 1px solid var(--site-border);
      box-shadow: var(--site-shadow);
      backdrop-filter: blur(10px);
    }

    .navbar:hover {
      background: var(--site-surface) !important;
    }

    .navbar ul li a {
      color: var(--site-text) !important;
      gap: 0.5rem;
      padding: 0.45rem 0.5rem;
    }

    .navbar ul li a:hover {
      background-color: var(--site-surface-strong) !important;
      color: var(--site-link-hover) !important;
    }

    .navbar ul li a img.nav-icon {
      padding: 0.45rem;
      color: var(--site-text);
      background: var(--site-bg-soft);
      border: 1px solid var(--site-border);
      border-radius: 8px;
      opacity: 0.82;
    }

    html[data-theme="light"] .navbar ul li a img.nav-icon {
      filter: none;
    }

    /* Style the tab */
    .tab {
      overflow: hidden;
      border: 1px solid var(--site-border);
      background-color: var(--site-surface);
      border-radius: 8px 8px 0 0;
    }

    /* Style the buttons inside the tab */
    .tab button {
      background-color: inherit;
      float: left;
      border: none;
      outline: none;
      cursor: pointer;
      padding: 14px 16px;
      transition: 0.3s;
      font-size: 17px;
      color: var(--site-text);
    }

    /* Change background color of buttons on hover */
    .tab button:hover {
      background-color: var(--site-surface-strong);
    }

    /* Create an active/current tablink class */
    .tab button.active {
      background-color: var(--site-surface-strong);
      color: var(--site-link-hover);
    }

    /* Style the tab content */
