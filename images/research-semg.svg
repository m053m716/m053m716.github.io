<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Wearable sEMG wristband decoding motor-unit activity into a click">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1a26"/><stop offset="1" stop-color="#12293d"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f3b52"/><stop offset="1" stop-color="#16283a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="800" height="340" fill="url(#bg)"/>
  <rect width="800" height="340" fill="url(#grid)"/>
  <!-- forearm -->
  <path d="M60 232 C 180 214, 300 206, 430 200 L 700 188 C 740 187, 742 232, 700 234 L 430 246 C 300 252, 180 250, 60 252 Z" fill="#1b3247"/>
  <path d="M60 232 C 180 214, 300 206, 430 200 L 700 188 C 740 187, 742 232, 700 234 L 430 246 C 300 252, 180 250, 60 252 Z" fill="none" stroke="#33536e" stroke-width="2"/>
  <!-- wristband -->
  <rect x="300" y="176" width="86" height="102" rx="14" fill="url(#band)" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="322" cy="200" r="6" fill="#2dd4bf"/><circle cx="343" cy="196" r="6" fill="#38bdf8"/><circle cx="364" cy="200" r="6" fill="#2dd4bf"/>
  <circle cx="322" cy="228" r="6" fill="#38bdf8"/><circle cx="343" cy="224" r="6" fill="#2dd4bf"/><circle cx="364" cy="228" r="6" fill="#38bdf8"/>
  <circle cx="322" cy="256" r="6" fill="#2dd4bf"/><circle cx="343" cy="252" r="6" fill="#38bdf8"/><circle cx="364" cy="256" r="6" fill="#2dd4bf"/>
  <!-- EMG trace -->
  <polyline points="60,86 120,86 138,86 146,58 156,110 164,86 210,86 226,86 234,44 246,124 254,86 310,86 330,86 338,66 348,102 356,86 420,86 470,86 478,52 490,116 498,86 560,86 640,86 720,86" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="60,86 720,86" stroke="#2dd4bf" stroke-opacity="0.18" stroke-width="1"/>
  <!-- decoded spikes -->
  <g fill="#38bdf8">
    <rect x="231" y="132" width="5" height="18" rx="2"/><rect x="485" y="132" width="5" height="18" rx="2"/><rect x="143" y="132" width="5" height="18" rx="2"/>
  </g>
  <line x1="146" y1="112" x2="146" y2="130" stroke="#38bdf8" stroke-opacity="0.5" stroke-dasharray="3 4"/>
  <line x1="234" y1="126" x2="234" y2="130" stroke="#38bdf8" stroke-opacity="0.5" stroke-dasharray="3 4"/>
  <line x1="488" y1="118" x2="488" y2="130" stroke="#38bdf8" stroke-opacity="0.5" stroke-dasharray="3 4"/>
  <!-- cursor + click ripple -->
  <g transform="translate(618,128)">
    <circle r="30" fill="none" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.35"/>
    <circle r="19" fill="none" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.6"/>
    <path d="M-4 -12 L 14 6 L 4 8 L 8 20 L 2 22 L -2 10 L -10 16 Z" fill="#fbbf24"/>
  </g>
  <text x="60" y="308" font-family="Verdana, sans-serif" font-size="17" fill="#9fc3dd" letter-spacing="2">SURFACE EMG &#8594; MOTOR UNITS &#8594; CLICK</text>
</svg>
